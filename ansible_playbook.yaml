---
- hosts: all
  become: yes
  tasks:
    - name: Mettre à jour les paquets
      apt:
        update_cache: yes
    - name: Installer Python3, pip, Flask et clients MySQL/MariaDB
      apt:
        name:
          - python3
          - python3-pip
          - python3-dev
          - default-libmysqlclient-dev
          - libmysqlclient-dev
          - pkg-config
          - mysql-client-core-8.0
        state: present
    - name: Installer Flask et dépendances Python via pip
      pip:
        name:
          - flask
          - flask-mysqldb
          - mysqlclient
          - mysql-connector-python
          - python-dotenv
        executable: pip3
    - name: Copier l'application Flask
      copy:
        src: ./app.py
        dest: /home/aat-cloud/app.py
        owner: aat-cloud
        mode: 0755
    - name: Copier le fichier .env de configuration Flask
      copy:
        src: .env
        dest: /home/aat-cloud/.env
        owner: aat-cloud
        mode: 0600

    - name: Créer un service systemd pour Flask
      copy:
        dest: /etc/systemd/system/flaskapp.service
        content: |
          [Unit]
          Description=Flask App
          After=network.target

          [Service]
          User=aat-cloud
          WorkingDirectory=/home/aat-cloud
          EnvironmentFile=/home/aat-cloud/.env
          ExecStart=/usr/bin/python3 /home/aat-cloud/app.py
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Recharger systemd
      command: systemctl daemon-reload

    - name: Démarrer et activer le service Flask
      systemd:
        name: flaskapp
        enabled: yes
        state: restarted
